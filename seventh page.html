<svg width="0" height="0" aria-hidden="true">
  <defs>
    <clipPath id="scallop-frame" clipPathUnits="userSpaceOnUse">
      <!-- 640x740 frame: scalloped top and bottom edges -->

<div class="container">
  <div class="img"><img id="lampoff" src="lampoff.png"><img id="lampon" src="lampon.png"></div>
</div>
<div class="bottom-text-box">
  <p>Waking up in the morning and turning my lamps on makes me have a good day.</p>
</div>
<script>
(function() {
  var glow = document.getElementById('cursor-glow');
  if (!glow) return;
  function moveGlow(e) {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  }
  function hideGlow() {
    glow.style.opacity = '0';
  }
  function showGlow() {
    glow.style.opacity = '1';
  }
  document.addEventListener('mousemove', moveGlow);
  document.addEventListener('mouseleave', hideGlow);
  document.addEventListener('mouseenter', showGlow);
})();
</script>
</body>
