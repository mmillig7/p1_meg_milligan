  <body>  
<nav class="page-arrows">

<div class="index-content">
  <div class="top-text-box">
    <p>Here you will find things that mean a lot to me in my life. I hope you can experience what goes through my head as you flip. Drag the photos on the bulletin board to arrange them.</p>
  </div>
  <div class="frame">
  <div class="frame-img"><img id="frame" src="frame.png" alt=""></div>
  <div class="pictures">
    <div class="pic-wrap pic-1"><a href="../second/secondpage.html"><img id="dog" src="dog.jpeg" alt=""></a></div>
    <div class="pic-wrap pic-2"><img id="lamp" src="lamp1.jpeg" alt=""></div>
    <div class="pic-wrap pic-3"><img id="thread" src="thread.jpeg" alt=""></div>
    <div class="pic-wrap pic-4"><a href="../fourth/fourth page.html"><img id="letter" src="letter.jpeg" alt=""></a></div>
    <div class="pic-wrap pic-5"><img id="orchid" src="orchid.jpeg" alt=""></div>
    <div class="pic-wrap pic-6"><img id="pattern" src="sparklepink.jpeg" alt=""></div>
    <div class="pic-wrap pic-7"><img src="snoopy4.jpeg" alt=""></div>
    <div class="pic-wrap pic-8"><img src="petals.webp" alt=""></div>
    <div class="pic-wrap pic-9"><img src="heart.jpeg" alt=""></div>
  </div>
  </div>
</div>
<script>
(function () {
  var wraps = document.querySelectorAll('.pic-wrap');
  var dragging = null;
  var startX, startY, startLeft, startTop;

  function onMouseDown(e) {
    if (e.button !== 0) return;
    var wrap = e.currentTarget;
    var r = wrap.getBoundingClientRect();
    dragging = wrap;
    wrap._dragged = false;
    startX = e.clientX;
    startY = e.clientY;
    startLeft = r.left;
    startTop = r.top;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
    e.preventDefault();
  }

  function onMouseMove(e) {
    if (!dragging) return;
    dragging._dragged = true;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    dragging.style.left = (startLeft + dx) + 'px';
    dragging.style.top = (startTop + dy) + 'px';
  }

  function onMouseUp() {
    if (dragging) {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }
    dragging = null;
  }

  wraps.forEach(function (wrap) {
    wrap.addEventListener('mousedown', onMouseDown);
  });

  document.querySelectorAll('.pic-wrap a').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var w = a.closest('.pic-wrap');
      if (w && w._dragged) e.preventDefault();
    });
  });
})();
</script>
</body>
</html>
